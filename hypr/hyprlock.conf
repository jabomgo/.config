$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgb(0, 0, 0)
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = $font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"%A, %d de %B"
    color = rgba(200, 200, 200, 0.8)
    font_size = 18
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

# Usuário
label {
    monitor =
    text =   $USER
    color = rgba(216, 222, 233, 0.9)
    font_size = 14
    font_family = $font Bold
    position = 0, 40
    halign = center
    valign = center
}

# Input
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.6)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(255, 255, 255)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    capslock_color = rgb(255, 200, 0)
    fade_on_empty = false
    placeholder_text = <i>Senha...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    hide_input = false
    position = 0, -30
    halign = center
    valign = center
}

# Layout do teclado
label {
    monitor =
    text = $LAYOUT
    color = rgba(200, 200, 200, 0.6)
    font_size = 12
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}

# Bateria (notebook) — remova se for desktop
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%"
    color = rgba(200, 200, 200, 0.6)
    font_size = 12
    font_family = $font
    position = -20, -20
    halign = right
    valign = top
}